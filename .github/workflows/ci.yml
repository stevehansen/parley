name: Build & Test

on:
  push:
    branches: [master]
    paths-ignore: [docs/**, "**.md"]
  pull_request:
    branches: [master]
    paths-ignore: [docs/**, "**.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Parley.slnx

      - name: Build
        run: dotnet build Parley.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Parley.slnx --no-build -c Release --logger "trx;LogFileName=results.trx" --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: ./test-results/*.trx
